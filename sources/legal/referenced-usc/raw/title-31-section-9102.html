<h3 class="section-head">&sect;9102. Establishing and acquiring corporations</h3>

<!-- field-end:head -->
<!-- field-start:statute -->

<p class="statutory-body">An agency may establish or acquire a corporation to act as an agency only by or under a law of the United States specifically authorizing the action.</p>

<!-- field-end:statute -->
<!-- field-start:sourcecredit -->

<p class="source-credit">(Pub. L. 97&ndash;258, Sept. 13, 1982, 96 Stat. 1042.)</p>

<!-- field-end:sourcecredit -->
