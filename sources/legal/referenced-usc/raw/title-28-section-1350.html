<h3 class="section-head">&sect;1350. Alien's action for tort</h3>

<!-- field-end:head -->
<!-- field-start:statute -->

<p class="statutory-body">The district courts shall have original jurisdiction of any civil action by an alien for a tort only, committed in violation of the law of nations or a treaty of the United States.</p>

<!-- field-end:statute -->
<!-- field-start:sourcecredit -->

<p class="source-credit">(June 25, 1948, ch. 646, 62 Stat. 934.)</p>

<!-- field-end:sourcecredit -->
