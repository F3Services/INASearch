name: Update Title 8 corpus

on:
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
    inputs:
      rebuild:
        description: Retry a previously detected release (or replay current source for commissioning)
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: title8-corpus-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TITLE8_NOTIFY_LOGIN: ${{ vars.TITLE8_NOTIFY_LOGIN || github.repository_owner }}
      TITLE8_BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check the current official Title 8 source
        id: check
        run: python3 tools/update-title8.py check --output tmp/title8-check
      - name: Report a publisher outage once
        if: failure() && steps.check.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/title8-update-github.js notify tmp/title8-check/report.json
      - name: Notify when a changed source is detected
        id: notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/title8-update-github.js notify tmp/title8-check/report.json
      - name: Install build dependencies
        if: steps.notify.outputs.build_needed == 'true' || inputs.rebuild
        run: npm ci --ignore-scripts
      - name: Test the updater and GitHub adapter
        if: steps.notify.outputs.build_needed == 'true' || inputs.rebuild
        run: |
          python3 tools/test-title8-update.py
          node tools/test-title8-update.js
          node tools/test-title8-update-github.js
      - name: Build and verify isolated corrected candidate
        id: build
        if: steps.notify.outputs.build_needed == 'true' || inputs.rebuild
        run: python3 tools/update-title8.py build --check-dir tmp/title8-check --output tmp/title8-candidate
      - name: Open a review pull request
        id: propose
        if: steps.build.outcome == 'success' && steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/title8-update-github.js propose tmp/title8-candidate
      - name: Notify that the candidate is ready
        if: steps.propose.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/title8-update-github.js notify tmp/title8-candidate/report.json
      - name: Notify that a detected update needs review
        if: failure() && steps.check.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/title8-update-github.js blocked tmp/title8-check/report.json
      - name: Save candidate or failure evidence
        if: always() && (steps.check.outputs.changed == 'true' || inputs.rebuild || steps.check.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: title8-candidate-${{ github.run_id }}
          path: |
            tmp/title8-check/report.json
            tmp/title8-candidate/
          retention-days: 7
          compression-level: 9
          if-no-files-found: warn
